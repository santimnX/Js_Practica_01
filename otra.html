<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = prompt('Ingrese un numero:');
        let num2= prompt('Ingrese otro numero:');
        let multiplicacion=parseInt(num1)*parseInt(num2);
        let suma=parseInt(num1)+parseInt(num2);
        let resta=parseInt(num1)-parseInt(num2);
        let division=parseInt(num2)/parseInt(num2);
        document.write("La suma: "+num1+' + '+num2+" = "+suma+"<br>");
        document.write("La resta: "+num1+' - '+num2+" = "+resta+"<br>");
        document.write("La multiplicacion: "+num1+' x '+num2+" = "+multiplicacion+"<br>");
        document.write("La divisiobn de los numeros: "+num1+' / '+num2+" = "+division+"<br>");
    </script>
</body>
</html>
